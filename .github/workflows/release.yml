name: Build and publish CLIP OS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Prepare source archive
        shell: pwsh
        run: |
          $archive = Get-Item clip-os-source-*.zip | Select-Object -First 1
          if (-not $archive) { throw 'CLIP OS source archive is missing' }
          New-Item -ItemType Directory -Force src | Out-Null
          Expand-Archive $archive.FullName src -Force

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            src/package-lock.json
            src/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src/backend/requirements.txt

      - name: Install FFmpeg
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress

      - name: Install dependencies
        shell: pwsh
        working-directory: src
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r backend\requirements.txt pyinstaller
          npm ci
          npm --prefix frontend ci

      - name: Verify project and migrations
        shell: pwsh
        working-directory: src
        run: |
          .\.venv\Scripts\python.exe scripts\verify_project.py
          npm run verify

      - name: Build signed-metadata installer
        shell: pwsh
        working-directory: src
        run: .\build-installer.ps1 -SkipInstall

      - name: Validate release metadata
        shell: pwsh
        working-directory: src
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if (-not (Test-Path "release\CLIP-OS-Setup-$version.exe")) { throw 'Installer missing' }
          if (-not (Test-Path 'release\latest.yml')) { throw 'latest.yml missing' }
          Select-String -Path 'release\latest.yml' -Pattern "version: $version" | Out-Null

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLIP-OS-Windows
          path: |
            src/release/CLIP-OS-Setup-*.exe
            src/release/CLIP-OS-Setup-*.exe.blockmap
            src/release/latest.yml

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src\package.json -Raw | ConvertFrom-Json).version
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v$version" }
          $assets = @(Get-Item src\release\CLIP-OS-Setup-*.exe, src\release\latest.yml)
          $assets += @(Get-Item src\release\CLIP-OS-Setup-*.exe.blockmap -ErrorAction SilentlyContinue)
          if ("${{ github.ref_type }}" -eq "tag") {
            gh release create $tag @($assets.FullName) --verify-tag --generate-notes --title "CLIP OS $version"
          } else {
            gh release create $tag @($assets.FullName) --target "${{ github.sha }}" --generate-notes --title "CLIP OS $version"
          }
